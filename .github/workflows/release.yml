name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser needs the full history and tags
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      # Opens a bump-treepi-<version> PR on the tap; its CI builds the bottles
      # and publishes them. A cross-repo PAT is required both to push there and
      # because PRs opened with GITHUB_TOKEN do not trigger the tap's CI.
      - run: brew tap cyakimov/tap
      - run: >-
          brew bump-formula-pr --no-fork --no-browse --no-audit
          --version="${GITHUB_REF_NAME#v}" cyakimov/tap/treepi
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
