name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # core's in-process git uses os.Environ(); the integration suite nulls
      # global config, so a committer identity must come from the environment.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@treepi
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@treepi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags integration ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.0
      - run: "$(go env GOPATH)/bin/golangci-lint run"
