version: 2

project_name: treepi

before:
  hooks:
    - go mod tidy

builds:
  - id: treepi
    main: ./cmd/treepi
    binary: treepi
    env:
      - CGO_ENABLED=0 # static binaries; clean cross-compile across the matrix
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/**/*

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: treepi
    binaries: [treepi]
    repository:
      owner: cyakimov
      name: homebrew-tap
    homepage: https://github.com/cyakimov/treepi
    description: Orchestrate git worktrees for humans and agents
    # Symlink `tp` alongside `treepi` - the `tp` alias is not a second binary.
    custom_block: |
      binary "treepi", target: "tp"
    # The cask is generated but not pushed until a cross-repo HOMEBREW_TAP_TOKEN
    # exists; set skip_upload to false (and add the secret) to publish the tap.
    skip_upload: true

scoops:
  - repository:
      owner: cyakimov
      name: scoop-bucket
    homepage: https://github.com/cyakimov/treepi
    description: Orchestrate git worktrees for humans and agents
    license: Apache-2.0
    skip_upload: true # see the cask note above

release:
  github:
    owner: cyakimov
    name: treepi
